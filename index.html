<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Claw Party</title>
<meta name="description" content="A low-poly claw machine game in the browser — move with WASD, drop with Space. 低多邊形風格網頁夾娃娃機。" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect x='3' y='3' width='26' height='26' rx='6' fill='%23C8925A'/><path d='M16 8v7M11 22l5-7 5 7' stroke='%23F2EDE4' stroke-width='2.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#E6E2DA; --card:#F7F4EE; --line:#DAD3C7; --ink:#2E2A26; --muted:#7A7268;
    --cream:#F2EDE4; --wood:#C8925A; --wood-d:#A87543; --green:#6E8F5E; --red:#B5533C;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{min-height:100vh; background:var(--bg); color:var(--ink);
    font-family:"Inter","Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,-apple-system,"Segoe UI",sans-serif;
    -webkit-font-smoothing:antialiased}
  button{font:inherit; color:inherit}
  .num{font-variant-numeric:tabular-nums}
  .app{max-width:1180px; margin:0 auto; padding:16px 16px 28px}

  .bar{display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:14px}
  .brand{display:flex; align-items:center; gap:10px; font-weight:700; font-size:20px; letter-spacing:.2px}
  .mark{width:28px; height:28px; border-radius:7px; background:var(--wood); display:grid; place-items:center}
  .actions{display:flex; gap:8px; align-items:center}
  .seg{display:inline-flex; background:var(--card); border:1px solid var(--line); border-radius:999px; padding:3px}
  .seg button{border:0; background:transparent; padding:6px 13px; border-radius:999px; font-weight:600; font-size:13px; color:var(--muted); cursor:pointer}
  .seg button.on{background:var(--ink); color:var(--cream)}
  .icon{width:36px; height:36px; border-radius:50%; border:1px solid var(--line); background:var(--card); cursor:pointer; display:grid; place-items:center; color:var(--ink)}
  .icon svg{width:17px; height:17px}
  .icon:hover, .seg button:not(.on):hover{background:#fff}

  .layout{display:grid; grid-template-columns:minmax(0,1fr) 316px; gap:16px; align-items:start}
  @media (max-width:960px){ .layout{grid-template-columns:1fr} }

  /* 遊戲畫面與 HUD */
  .screen{position:relative; border-radius:14px; overflow:hidden; background:var(--bg); border:1px solid var(--line)}
  canvas#game{display:block; width:100%; height:auto; aspect-ratio:4/3; touch-action:none}
  .hud{position:absolute; left:12px; top:12px; display:flex; background:rgba(247,244,238,.94); border:1px solid var(--line); border-radius:10px; pointer-events:none}
  .hud > div{padding:6px 12px; min-width:62px}
  .hud > div + div{border-left:1px solid var(--line)}
  .lb{display:block; font-size:10px; font-weight:600; letter-spacing:1px; text-transform:uppercase; color:var(--muted)}
  .hud b, .timer b{display:block; font-size:18px; font-weight:700; line-height:1.25}
  .timer{position:absolute; right:12px; top:12px; width:78px; padding:6px 12px 8px; background:rgba(247,244,238,.94); border:1px solid var(--line); border-radius:10px; pointer-events:none}
  .timer[hidden]{display:none}
  .timer i{display:block; height:3px; background:var(--line); border-radius:2px; margin-top:4px; overflow:hidden}
  .timer s{display:block; height:100%; background:var(--ink); width:100%}
  .timer.low b{color:var(--red)} .timer.low s{background:var(--red)}
  .toast{position:absolute; left:50%; top:66px; transform:translate(-50%,-6px); max-width:80%; padding:8px 16px; background:var(--card); border:1px solid var(--line);
         border-left:4px solid var(--ink); border-radius:8px; font-size:14px; font-weight:600; opacity:0; transition:opacity .2s, transform .2s; pointer-events:none; text-align:center}
  .toast.show{opacity:1; transform:translate(-50%,0)}
  .toast.good{border-left-color:var(--green)} .toast.bad{border-left-color:var(--red)}
  .prompt{position:absolute; left:50%; top:34%; transform:translateX(-50%); padding:10px 18px; background:var(--ink); color:var(--cream); border-radius:999px;
          font-size:15px; font-weight:600; white-space:nowrap; pointer-events:none}
  .prompt[hidden]{display:none}
  .prompt.warn{background:var(--red)}
  .tag{position:absolute; transform:translate(-50%,-100%); padding:5px 10px; background:var(--card); border:1px solid var(--line); border-radius:8px;
       font-size:12px; line-height:1.4; text-align:center; pointer-events:none; white-space:nowrap}
  .tag[hidden]{display:none}
  .tag b{display:block; font-size:13px}
  .tag.ok{border-bottom:3px solid var(--green)} .tag.no{border-bottom:3px solid var(--red)} .tag.no span{color:var(--red)}
  .floater{position:absolute; transform:translate(-50%,-50%); font-weight:700; font-size:20px; color:var(--ink); pointer-events:none; white-space:nowrap;
           animation:rise 1.6s ease-out forwards}
  .floater.sub{font-size:13px; font-weight:600; color:var(--muted)}
  .floater.rec{font-size:24px; color:var(--red)}
  @keyframes rise{0%{opacity:0; margin-top:10px} 15%{opacity:1} 100%{opacity:0; margin-top:-50px}}
  canvas#game{cursor:grab} canvas#game:active{cursor:grabbing}
  .viewreset{position:absolute; right:12px; bottom:12px; padding:7px 12px; border:1px solid var(--line); border-radius:8px; background:rgba(247,244,238,.94);
             font-size:12px; font-weight:600; cursor:pointer}
  .viewreset[hidden]{display:none}
  .viewreset:hover{background:#fff}
  .glerr{position:absolute; inset:0; display:grid; place-items:center; padding:24px; text-align:center; color:var(--muted); font-size:14px; line-height:1.6}
  .glerr[hidden]{display:none}
  @media (max-width:560px){ .hud > div{padding:5px 8px; min-width:0} .hud b, .timer b{font-size:15px} .prompt{font-size:13px} .toast{font-size:12px; top:58px} }

  .keys{font-size:13px; color:var(--muted); text-align:center; margin:12px 0 0; line-height:2}
  kbd{display:inline-block; min-width:22px; padding:0 6px; border-radius:5px; background:var(--card); border:1px solid var(--line); border-bottom-width:2px;
      color:var(--ink); font:600 11px/18px ui-monospace,Menlo,Consolas,monospace; text-align:center; margin:0 1px}

  /* 側欄 */
  .card{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px; margin-bottom:12px}
  .head{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:10px; gap:8px}
  .head .hint{font-size:12px; color:var(--muted); text-align:right}
  .claws{display:grid; grid-template-columns:repeat(3,1fr); gap:8px}
  .claw{all:unset; box-sizing:border-box; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:1px; padding:6px 4px 10px;
        border-radius:10px; border:1px solid var(--line); background:#fff; text-align:center}
  .claw img{width:52px; height:52px}
  .claw .nm{font-weight:600; font-size:13px}
  .claw .cost{font-weight:700; font-size:16px}
  .claw .ds{font-size:11px; color:var(--muted); line-height:1.25}
  .claw.sel{border:2px solid var(--wood); padding:5px 3px 9px; background:var(--cream)}
  .claw.poor .cost{color:var(--red)}
  .claw[aria-disabled="true"]{opacity:.5; cursor:not-allowed}
  .claw:focus-visible{outline:2px solid var(--ink); outline-offset:2px}

  .tabs{display:flex; background:var(--bg); border-radius:999px; padding:3px; margin-bottom:10px}
  .tab{flex:1; border:0; background:transparent; padding:7px; border-radius:999px; font-weight:600; font-size:13px; color:var(--muted); cursor:pointer}
  .tab.on{background:#fff; color:var(--ink)}
  .scroll{max-height:320px; overflow:auto}
  .inv-row{display:grid; grid-template-columns:42px 1fr auto; gap:10px; align-items:center; padding:7px 2px; border-bottom:1px solid var(--line)}
  .inv-row:last-child{border-bottom:0}
  .inv-row img{width:42px; height:42px}
  .inv-row .nm{font-weight:600; font-size:14px}
  .inv-row .sub{font-size:12px; color:var(--muted)}
  .inv-actions{display:flex; gap:6px}
  .foot{display:flex; justify-content:space-between; align-items:center; margin-top:10px; font-size:13px; color:var(--muted); font-weight:500}
  .empty{color:var(--muted); text-align:center; font-size:14px; padding:18px 0; margin:0; line-height:1.6}
  .btn{border:0; border-radius:8px; padding:7px 12px; font-size:13px; font-weight:600; cursor:pointer; background:var(--ink); color:var(--cream)}
  .btn.ghost{background:transparent; color:var(--ink); border:1px solid var(--line)}
  .btn:disabled{opacity:.35; cursor:not-allowed}

  .dex{display:grid; grid-template-columns:1fr 1fr; gap:8px}
  .dex-item{background:#fff; border:1px solid var(--line); border-radius:10px; padding:8px; text-align:center; position:relative; font-size:12px; line-height:1.55}
  .dex-item img{width:64px; height:64px}
  .dex-item.locked img{filter:grayscale(1) opacity(.35)}
  .dex-item.locked .nm{color:var(--muted)}
  .dex-item .nm{font-weight:600; font-size:13px}
  .dex-item .got{position:absolute; top:7px; right:8px; width:7px; height:7px; border-radius:50%; background:var(--green)}
  .dex-item .meta{color:var(--muted)}
  .dex-prog{grid-column:1/-1; text-align:center; color:var(--muted); font-size:12px; margin:4px 0 0}
  .tier{display:inline-block; padding:0 8px; border-radius:99px; font-size:10px; font-weight:600; letter-spacing:.5px; color:#fff; text-transform:uppercase}
  .t0{background:#8A9A7B} .t1{background:#7F94A6} .t2{background:#B08A5A} .t3{background:#9B5B45}
  .pips{letter-spacing:2px; color:var(--wood)} .pips i{font-style:normal; color:var(--line)}

  .touch{display:none; margin-top:12px; justify-content:space-between; align-items:center; gap:16px; user-select:none; -webkit-user-select:none}
  @media (hover:none) and (pointer:coarse){ .touch{display:flex} .keys{display:none} }
  .dpad{display:grid; grid-template-columns:repeat(3,54px); grid-template-rows:repeat(3,54px); gap:6px}
  .dpad button{border:1px solid var(--line); border-radius:12px; background:var(--card); color:var(--ink); font-size:18px; touch-action:none}
  .dpad button.on{background:var(--ink); color:var(--cream)}
  .dpad .u{grid-column:2; grid-row:1} .dpad .l{grid-column:1; grid-row:2} .dpad .r{grid-column:3; grid-row:2} .dpad .d{grid-column:2; grid-row:3}
  .grab{width:112px; height:112px; border:0; border-radius:50%; background:var(--ink); color:var(--cream); font-size:18px; font-weight:700; touch-action:none; box-shadow:0 5px 0 #15120f}
  .grab:active{transform:translateY(3px); box-shadow:0 2px 0 #15120f}

  .modal{position:fixed; inset:0; background:rgba(46,42,38,.35); display:grid; place-items:center; z-index:10; padding:16px}
  .modal[hidden]{display:none}
  .modal-box{background:var(--card); border:1px solid var(--line); border-radius:16px; padding:28px 24px; max-width:340px; width:100%; text-align:center}
  .modal-box h3{margin:0 0 4px; font-size:22px; font-weight:700}
  .modal-box .big{font-size:44px; font-weight:700; margin:10px 0 4px}
  .modal-box p{color:var(--muted); margin:6px 0; line-height:1.5}
</style>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
</script>
</head>
<body>
<div class="app">
  <header class="bar">
    <div class="brand">
      <span class="mark"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#F2EDE4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2v5M4 13l4-6 4 6"/></svg></span>
      <span data-i18n="title"></span>
    </div>
    <div class="actions">
      <div class="seg" role="group" aria-label="Language"><button data-lang="zh">中文</button><button data-lang="en">EN</button></div>
      <button class="icon" id="muteBtn" aria-label="Sound"></button>
      <button class="icon" id="restartBtn" data-i18n-title="restart" aria-label="Restart">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 10a6.5 6.5 0 1 0 2-4.7"/><path d="M3.5 3.5v3.2h3.2"/></svg>
      </button>
    </div>
  </header>

  <main class="layout">
    <section>
      <div class="screen" id="screen">
        <canvas id="game" aria-label="Claw machine"></canvas>
        <div class="hud num">
          <div><span class="lb" data-i18n="money"></span><b id="hMoney">$0</b></div>
          <div><span class="lb" data-i18n="score"></span><b id="hScore">0</b></div>
          <div><span class="lb" data-i18n="best"></span><b id="hBest">0</b></div>
          <div><span class="lb" data-i18n="left"></span><b id="hLeft">0</b></div>
        </div>
        <div class="timer num" id="timer" hidden><span class="lb" data-i18n="time"></span><b id="tNum">20</b><i><s id="tBar"></s></i></div>
        <div class="toast" id="toast"></div>
        <div class="prompt" id="prompt" hidden></div>
        <div class="tag" id="tag" hidden><b id="tagName"></b><span id="tagInfo"></span></div>
        <div id="floaters"></div>
        <button class="viewreset" id="viewReset" hidden data-i18n="resetView"></button>
        <div class="glerr" id="glErr" hidden></div>
      </div>
      <p class="keys" data-i18n="keys"></p>
      <div class="touch">
        <div class="dpad">
          <button class="u" data-dir="w" aria-label="Up">&#9650;</button>
          <button class="l" data-dir="a" aria-label="Left">&#9664;</button>
          <button class="r" data-dir="d" aria-label="Right">&#9654;</button>
          <button class="d" data-dir="s" aria-label="Down">&#9660;</button>
        </div>
        <button class="grab" id="grabBtn"></button>
      </div>
    </section>

    <aside>
      <div class="card">
        <div class="head"><span class="lb" data-i18n="claw"></span><span class="hint" data-i18n="clawHint"></span></div>
        <div class="claws" id="claws"></div>
      </div>
      <div class="card">
        <div class="tabs">
          <button class="tab on" data-tab="shop" data-i18n="tabBag"></button>
          <button class="tab" data-tab="dex" data-i18n="tabDex"></button>
        </div>
        <div id="panel-shop">
          <div class="scroll" id="inv"></div>
          <div class="foot num"><span id="invTotal"></span><button class="btn" id="sellAll" data-i18n="sellAll"></button></div>
        </div>
        <div id="panel-dex" hidden><div class="scroll"><div class="dex" id="dex"></div></div></div>
      </div>
    </aside>
  </main>
</div>

<div class="modal" id="confirm" hidden>
  <div class="modal-box">
    <h3 data-i18n="confirmTitle"></h3>
    <p data-i18n="confirmRestart"></p>
    <div style="display:flex; gap:8px; justify-content:center; margin-top:16px">
      <button class="btn ghost" id="cCancel" data-i18n="cancel" style="padding:10px 20px; font-size:14px"></button>
      <button class="btn" id="cOk" data-i18n="restart" style="padding:10px 20px; font-size:14px"></button>
    </div>
  </div>
</div>

<div class="modal" id="modal" hidden>
  <div class="modal-box">
    <h3 data-i18n="overTitle"></h3>
    <p data-i18n="overSub"></p>
    <div class="big num" id="mScore">0</div>
    <p id="mDetail"></p>
    <button class="btn" id="mRestart" data-i18n="playAgain" style="margin-top:14px; padding:10px 24px; font-size:15px"></button>
  </div>
</div>

<script type="module">

let lang = store.get('clawParty.lang', null) || 'en';   // 預設英文，使用者切換後會記住
function t(key, p = {}) {
  const s = (I18N[lang][key] ?? I18N.zh[key] ?? key);

/* ================= 遊戲座標（與第一版相同：x 左右、z 前後、h 高度） ================= */
const FW = 440, FD = 210;
const TOP_H = 230, PLAY_TIME = 20, START_MONEY = 200, GRAVITY = 900;
const HOLE = { x1: 0, x2: 118, z1: FD - 104, z2: FD };
const HOME = { x: (HOLE.x1 + HOLE.x2) / 2, z: (HOLE.z1 + HOLE.z2) / 2 };
// 換算到 3D 世界座標
const K = 1 / 40;
const WX = (x) => (x - FW / 2) * K;
const WZ = (z) => (z * 1.5 - FD * .75) * K;
const WY = (h) => h * K;

/* ================= 夾爪與獎品設定 ================= */
const CLAWS = [
  { name: { zh: '小夾爪', en: 'Small Claw' },  desc: { zh: '只能抓小型', en: 'Small animals' },  cost: 10, maxR: 24, reach: 18, scale: 0.95, color: '#7F94A6' },
  { name: { zh: '中夾爪', en: 'Medium Claw' }, desc: { zh: '小型＋中型', en: 'Small + medium' }, cost: 25, maxR: 36, reach: 24, scale: 1.3,  color: '#B8975A' },
  { name: { zh: '大夾爪', en: 'Large Claw' },  desc: { zh: '全部都能抓', en: 'Grabs anything' }, cost: 50, maxR: 54, reach: 32, scale: 1.8,  color: '#9B5B45' },
];
// r：大小　grip：基礎抓取率（越低越難）　value：商店售價　score：得分
const TYPES = [
  { id: 'rabbit',   name: { zh: '兔子', en: 'Rabbit' },   tier: 0, r: 18, grip: .90, value: 12,  score: 10,  weight: 10 },
  { id: 'penguin',  name: { zh: '企鵝', en: 'Penguin' },  tier: 0, r: 19, grip: .85, value: 15,  score: 15,  weight: 9 },
  { id: 'cat',      name: { zh: '貓',   en: 'Cat' },      tier: 0, r: 21, grip: .80, value: 20,  score: 25,  weight: 8 },
  { id: 'fox',      name: { zh: '狐狸', en: 'Fox' },      tier: 1, r: 28, grip: .70, value: 45,  score: 50,  weight: 6 },
  { id: 'bear',     name: { zh: '熊',   en: 'Bear' },     tier: 1, r: 30, grip: .65, value: 50,  score: 60,  weight: 5 },
  { id: 'deer',     name: { zh: '鹿',   en: 'Deer' },     tier: 1, r: 33, grip: .60, value: 60,  score: 80,  weight: 4 },
  { id: 'elephant', name: { zh: '大象', en: 'Elephant' }, tier: 2, r: 47, grip: .45, value: 140, score: 200, weight: 3 },
  { id: 'lion',     name: { zh: '獅子', en: 'Lion' },     tier: 3, r: 50, grip: .30, value: 300, score: 400, weight: 1, rare: true },
];
const TYPE = Object.fromEntries(TYPES.map(ty => [ty.id, ty]));
const TIER_NAMES = { zh: ['小型', '中型', '大型', '稀有'], en: ['Small', 'Medium', 'Large', 'Rare'] };
const nm = (o) => o.name[lang];
const needClaw = (ty) => CLAWS.findIndex(c => c.maxR >= ty.r);
const stars = (ty) => clamp(Math.round((1 - ty.grip) * 7.5), 1, 5);
const prongLen = (c) => 36 * c.scale;
const gripH = (p, c) => 1.2 * p.r + 0.5 * prongLen(c);
const holdOpen = (p, c) => clamp(.25 + .55 * p.r / c.maxR, .25, .8);
const floorDist = (x1, z1, x2, z2) => Math.hypot(x1 - x2, (z1 - z2) * 1.5);
const isOverHole = (x, z) => x > HOLE.x1 && x < HOLE.x2 && z > HOLE.z1 && z < HOLE.z2;
const inHoleZone = (x, z, r) => x - r * .5 < HOLE.x2 + 10 && z + r * .3 > HOLE.z1 - 10;

/* ================= 音效 ================= */
let actx = null;
let muted = store.get('clawParty.muted', false);
function unlockAudio() {
  if (actx) { if (actx.state === 'suspended') actx.resume(); return; }
  try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { actx = null; }
}
function tone(freq, dur, type = 'square', vol = .05, slide = 0, delay = 0) {
  if (muted || !actx) return;
  const t0 = actx.currentTime + delay;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t0);
  if (slide) o.frequency.linearRampToValueAtTime(Math.max(40, freq + slide), t0 + dur);
  g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
  o.connect(g); g.connect(actx.destination); o.start(t0); o.stop(t0 + dur + .02);
}
const sfx = {
  coin()   { tone(988, .08, 'triangle', .06); tone(1319, .16, 'triangle', .06, 0, .08); },
  drop()   { tone(420, .45, 'triangle', .05, -220); },
  grab()   { tone(160, .08, 'square', .04); tone(210, .1, 'square', .035, 0, .07); },
  win()    { [523, 659, 784, 1047].forEach((f, i) => tone(f, .16, 'triangle', .07, 0, i * .09)); },
  fail()   { tone(300, .2, 'triangle', .05, -110); tone(210, .25, 'triangle', .05, -70, .15); },
  sell()   { tone(1200, .06, 'triangle', .05); tone(1600, .1, 'triangle', .05, 0, .06); },
  tick()   { tone(880, .04, 'triangle', .04); },
  refill() { [392, 523, 659].forEach((f, i) => tone(f, .12, 'triangle', .05, 0, i * .1)); },
};

/* ================= 遊戲狀態 ================= */
let game = null;
let best = store.get('clawParty.best', 0);
let dex = new Set(store.get('clawParty.dex', []).filter(id => TYPE[id]));   // 忽略舊版本留下的獎品 id
let selClaw = 0;
let prizes = [];
let time = 0;
let aimTarget = null;
let uid = 0;
const keys = { w: false, a: false, s: false, d: false };
const claw = { x: HOME.x, z: HOME.z, h: TOP_H, open: .25, state: 'idle', type: 0, timer: 0, phaseT: 0,
               stopH: 0, target: null, carry: null, slip: null, moveDist: 1 };

function makePrize(type, x, z) {
  return { id: ++uid, type, r: type.r, x, z, h: 0, vh: 0, yaw: rand(-.65, .65), phase: Math.random() * TAU,
           wiggle: 0, state: 'floor', delay: 0, done: false };
}
function pickType(tier) {
  const list = TYPES.filter(ty => ty.tier === tier);
  let r = Math.random() * list.reduce((s, ty) => s + ty.weight, 0);
  for (const ty of list) { r -= ty.weight; if (r <= 0) return ty; }
  return list[list.length - 1];
}
function refill() {
  const keep = prizes.filter(p => p.state === 'hole');
  // 每種動物（含獅子）保證至少一隻，其餘隨機補滿
  const plan = TYPES.slice();
  for (let i = 0; i < 5; i++) plan.push(pickType(0));
  for (let i = 0; i < 2; i++) plan.push(pickType(1));
  plan.push(TYPE.elephant);
  plan.sort((a, b) => b.r - a.r);
  const placed = [];
  for (const ty of plan) {
    let bestPos = null, bestGap = -Infinity;
    for (let i = 0; i < 160; i++) {
      const x = rand(ty.r + 6, FW - ty.r - 6), z = rand(10, FD - 8);
      if (inHoleZone(x, z, ty.r)) continue;
      let gap = Infinity;
      for (const q of placed) gap = Math.min(gap, floorDist(x, z, q.x, q.z) - (q.r + ty.r) * .78);
      if (gap > bestGap) { bestGap = gap; bestPos = { x, z }; }
      if (gap >= 0) break;
    }
    if (!bestPos) bestPos = { x: FW - ty.r - 10, z: FD / 2 };
    const p = makePrize(ty, bestPos.x, bestPos.z);
    p.state = 'fall'; p.h = rand(180, 330); p.delay = rand(0, 1.1);
    placed.push(p);
  }
  prizes = keep.concat(placed);
  sfx.refill();
}
const remaining = () => prizes.filter(p => p.state !== 'hole').length;
const luckBonus = () => Math.min(.3, game.failStreak * .05);
const hasInventory = () => TYPES.some(ty => (game.inventory[ty.id] || 0) > 0);

function newGame() {
  game = { money: START_MONEY, score: 0, plays: 0, wins: 0, failStreak: 0, inventory: {}, newRecord: false, over: false };
  Object.assign(claw, { x: HOME.x, z: HOME.z, h: TOP_H, open: .25, state: 'idle', type: selClaw, target: null, carry: null, slip: null });
  prizes = [];
  refill();
  $('#modal').hidden = true;
  updateUI(); renderInventory(); renderDex();
  showToast(t('welcome'), 'info');
}

/* ================= 遊戲流程 ================= */
const modalOpen = () => !$('#modal').hidden || !$('#confirm').hidden;
function action() {
  if (modalOpen()) return;
  if (claw.state === 'idle') insertCoin();
  else if (claw.state === 'aim') startDrop();
}
function insertCoin() {
  if (claw.state !== 'idle' || game.over) return;
  const c = CLAWS[selClaw];
  if (game.money < c.cost) {
    sfx.fail();
    showToast(game.money >= CLAWS[0].cost ? t('noMoneyClaw', { c: nm(c) }) : t('noMoney'), 'bad');
    return;
  }
  game.money -= c.cost; game.plays++;
  claw.type = selClaw; claw.state = 'aim'; claw.timer = PLAY_TIME;
  pressButton();
  sfx.coin();
  showToast(t('coinIn', { c: c.cost }), 'info');
  updateUI();
}
function findTarget() {
  const c = CLAWS[claw.type];
  let bestP = null, bd = Infinity;
  for (const p of prizes) {
    if (p.state !== 'floor') continue;
    const d = floorDist(claw.x, claw.z, p.x, p.z);
    if (d < c.reach + p.r * .45 && d < bd) { bd = d; bestP = p; }
  }
  return bestP;
}
function startDrop() {
  if (claw.state !== 'aim') return;
  const c = CLAWS[claw.type];
  claw.target = findTarget();
  claw.stopH = claw.target ? gripH(claw.target, c) : prongLen(c) * .95;
  claw.state = 'down';
  pressButton();
  sfx.drop(); updateUI();
}
function resolveGrab() {
  const c = CLAWS[claw.type], p = claw.target;
  claw.carry = null; claw.slip = null;
  if (!p || p.state !== 'floor') { fail(t('whiff')); return; }
  if (p.r > c.maxR) {
    p.wiggle = 1;
    fail(t('tooBig', { n: nm(p.type), c: nm(CLAWS[needClaw(p.type)]) }));
    return;
  }
  const reachLim = c.reach + p.r * .45;
  const d = floorDist(claw.x, claw.z, p.x, p.z);
  const align = clamp(1 - d / reachLim, 0, 1);
  const sizeBonus = 1 + clamp((c.maxR - p.r) / 120, 0, .15);
  const luck = luckBonus();
  const chance = clamp(p.type.grip * (.45 + .55 * align) * sizeBonus + luck, .05, .97);
  if (Math.random() < chance) {
    p.state = 'carried'; claw.carry = p; sfx.grab();
    const slipChance = clamp((1 - p.type.grip) * .32 * (1.3 - align * .6) - luck * .5, 0, .5);
    if (Math.random() < slipChance) claw.slip = { phase: Math.random() < .5 ? 'up' : 'move', at: rand(.25, .85) };
    showToast(align > .8 ? t('perfect') : t('grabbed'), 'good');
  } else {
    p.wiggle = 1;
    const ang = Math.random() * TAU;
    const nx = clamp(p.x + Math.cos(ang) * 8, p.r + 4, FW - p.r - 4);
    const nz = clamp(p.z + Math.sin(ang) * 6, 8, FD - 6);
    if (!inHoleZone(nx, nz, p.r)) { p.x = nx; p.z = nz; }
    fail(align < .35 ? t('offCenter') : t('close'));
  }
}
function fail(msg) {
  game.failStreak++;
  sfx.fail();
  showToast(msg + (game.failStreak >= 2 ? t('luck', { n: Math.round(luckBonus() * 100) }) : ''), 'bad');
  updateUI();
}
function doSlip() {
  const p = claw.carry;
  if (!p) return;
  p.state = 'fall'; p.vh = 40; p.wiggle = 1;
  claw.carry = null; claw.slip = null;
  game.failStreak++;
  sfx.fail();
  showToast(t('slip'), 'bad');
  updateUI();
}
function settle(p) {
  if (inHoleZone(p.x, p.z, p.r) && !isOverHole(p.x, p.z)) p.x = HOLE.x2 + 12 + p.r * .5;
  p.x = clamp(p.x, p.r + 4, FW - p.r - 4);
  p.z = clamp(p.z, 8, FD - 6);
}
function award(p) {
  prizes = prizes.filter(q => q !== p);
  const ty = p.type;
  game.inventory[ty.id] = (game.inventory[ty.id] || 0) + 1;
  game.score += ty.score; game.wins++; game.failStreak = 0;
  const isNew = !dex.has(ty.id);
  if (isNew) { dex.add(ty.id); store.set('clawParty.dex', [...dex]); }
  const at = new THREE.Vector3(WX(HOME.x), 1.6, WZ(HOLE.z1));
  addFloater(at, t('plus', { s: ty.score }), '');
  addFloater(at, `${nm(ty)} · $${ty.value}`, 'sub', 26);
  if (game.score > best) {
    best = game.score; store.set('clawParty.best', best);
    if (!game.newRecord) { game.newRecord = true; addFloater(new THREE.Vector3(0, 4.2, 0), t('newRecord'), 'rec'); }
  }
  sfx.win();
  const k = ty.rare ? 'rare' : isNew ? 'newFind' : 'got';
  showToast(t(k, { n: nm(ty), s: ty.score }), 'good');
  updateUI(); renderInventory(); renderDex();
}
function finishRound() {
  claw.state = 'idle'; claw.target = null; claw.carry = null; claw.slip = null;
  if (remaining() === 0) { showToast(t('refill'), 'info'); refill(); }
  checkGameOver();
  updateUI();
}
function checkGameOver() {
  if (claw.state !== 'idle' || game.over) return;
  if (prizes.some(p => p.state === 'hole')) return;
  if (game.money < CLAWS[0].cost && !hasInventory()) {
    game.over = true;
    setTimeout(showGameOver, 700);
  }
}
function showGameOver() {
  $('#mScore').textContent = game.score;
  $('#mDetail').innerHTML = `${game.newRecord ? `<b style="color:var(--red)">${t('overRec')}</b>` : t('overBest', { b: best })}<br>${t('overStats', { w: game.wins, p: game.plays })}`;
  $('#modal').hidden = false;
}
function sell(id, n) {
  const have = game.inventory[id] || 0;
  n = Math.min(n, have);
  if (!n) return;
  const ty = TYPE[id];
  game.inventory[id] = have - n;
  game.money += ty.value * n;
  sfx.sell();
  showToast(t('sold', { n: nm(ty), k: n, v: ty.value * n }), 'good');
  updateUI(); renderInventory();
}
function selectClaw(i) {
  if (claw.state !== 'idle') { showToast(t('busy'), 'info'); return; }
  selClaw = i; claw.type = i;
  sfx.tick(); updateUI();
}

/* ================= 更新 ================= */
function update(dt) {
  time += dt;
  const c = CLAWS[claw.type];
  switch (claw.state) {
    case 'idle':
      claw.type = selClaw;
      claw.open = approach(claw.open, .25, dt * 4);
      claw.x = approach(claw.x, HOME.x, dt * 5);
      claw.z = approach(claw.z, HOME.z, dt * 5);
      claw.h = approach(claw.h, TOP_H, dt * 5);
      break;
    case 'aim': {
      const prevSec = Math.ceil(claw.timer);
      claw.timer -= dt;
      const sec = Math.ceil(claw.timer);
      if (sec !== prevSec && sec <= 5 && sec > 0) sfx.tick();
      // 依目前鏡頭方向換算：W 永遠是「往畫面裡面」
      const ix = (keys.d ? 1 : 0) - (keys.a ? 1 : 0), iz = (keys.s ? 1 : 0) - (keys.w ? 1 : 0);
      const cy = Math.cos(view.yaw), sy = Math.sin(view.yaw);
      let mx = ix * cy + iz * sy, mz = -ix * sy + iz * cy;
      const ml = Math.hypot(mx, mz);
      if (ml > 1) { mx /= ml; mz /= ml; }
      claw.x = clamp(claw.x + mx * 240 * dt, 8, FW - 8);
      claw.z = clamp(claw.z + mz * 150 * dt, 6, FD - 6);
      claw.open = approach(claw.open, .25, dt * 4);
      if (claw.timer <= 0) { showToast(t('timeUp'), 'info'); startDrop(); }
      break;
    }
    case 'down':
      claw.open = approach(claw.open, 1, dt * 6);
      claw.h -= 260 * dt;
      if (claw.h <= claw.stopH) { claw.h = claw.stopH; claw.state = 'close'; claw.phaseT = 0; }
      break;
    case 'close': {
      claw.phaseT += dt;
      const tg = claw.target;
      const closeTo = tg && tg.state === 'floor' ? (tg.r <= c.maxR ? holdOpen(tg, c) : .7) : 0;
      claw.open = approach(claw.open, closeTo, dt * 5);
      if (claw.phaseT >= .55) { resolveGrab(); claw.state = 'up'; }
      break;
    }
    case 'up':
      claw.h = Math.min(TOP_H, claw.h + 165 * dt);
      claw.open = approach(claw.open, claw.carry ? holdOpen(claw.carry, c) : 0, dt * 4);
      if (claw.carry && claw.slip && claw.slip.phase === 'up') {
        const prog = (claw.h - claw.stopH) / Math.max(1, TOP_H - claw.stopH);
        if (prog >= claw.slip.at) doSlip();
      }
      if (claw.h >= TOP_H) { claw.state = 'toHole'; claw.moveDist = Math.max(1, Math.hypot(HOME.x - claw.x, HOME.z - claw.z)); }
      break;
    case 'toHole': {
      const dx = HOME.x - claw.x, dz = HOME.z - claw.z, dist = Math.hypot(dx, dz), step = 200 * dt;
      if (dist <= step) { claw.x = HOME.x; claw.z = HOME.z; claw.state = 'release'; claw.phaseT = 0; }
      else { claw.x += dx / dist * step; claw.z += dz / dist * step; }
      if (claw.carry && claw.slip && claw.slip.phase === 'move' && 1 - dist / claw.moveDist >= claw.slip.at) doSlip();
      break;
    }
    case 'release':
      claw.phaseT += dt;
      claw.open = approach(claw.open, 1, dt * 5);
      if (claw.carry && claw.phaseT > .12) { claw.carry.state = 'hole'; claw.carry.vh = 0; claw.carry = null; }
      if (claw.phaseT > 1.15) finishRound();
      break;
  }
  if (claw.carry) { const p = claw.carry; p.x = claw.x; p.z = claw.z; p.h = claw.h - gripH(p, c); }
  aimTarget = claw.state === 'aim' ? findTarget() : null;

  for (const p of prizes) {
    if (p.delay > 0) { p.delay -= dt; continue; }
    p.wiggle = Math.max(0, p.wiggle - dt * 1.6);
    if (p.state === 'fall') {
      p.vh -= GRAVITY * dt; p.h += p.vh * dt;
      if (p.h <= 0) {
        p.h = 0;
        if (isOverHole(p.x, p.z)) { p.state = 'hole'; p.vh = -60; showToast(t('luckyDrop'), 'good'); }
        else if (p.vh < -180) { p.vh = -p.vh * .28; p.wiggle = .6; }
        else { p.vh = 0; p.state = 'floor'; settle(p); }
      }
    } else if (p.state === 'hole') {
      p.vh -= GRAVITY * dt; p.h += p.vh * dt;
      if (p.h < -(2 * p.r + 40)) p.done = true;
    }
  }
  prizes.filter(p => p.done).forEach(award);
}

/* =====================================================================
   3D：Low-poly 場景
   ===================================================================== */
const COLOR = {
  bg: '#E6E2DA', cream: '#F2EDE4', wood: '#C8925A', woodD: '#A87543', floor: '#DCD4C6', wall: '#EAE3D7',
  chute: '#4A443D', ink: '#3A342E', steel: '#8F8A82', steelD: '#5E5850',
};
const matCache = new Map();
function mat(color, extra) {
  const key = color + (extra ? JSON.stringify(extra) : '');
  if (!matCache.has(key)) {
    matCache.set(key, new THREE.MeshStandardMaterial(Object.assign({ color, flatShading: true, roughness: .9, metalness: 0 }, extra || {})));
  }
  return matCache.get(key);
}
const GEO = {
  box: new THREE.BoxGeometry(1, 1, 1),
  ico0: new THREE.IcosahedronGeometry(1, 0),
  ico1: new THREE.IcosahedronGeometry(1, 1),
  cyl6: new THREE.CylinderGeometry(1, 1, 1, 6),
  cyl8: new THREE.CylinderGeometry(1, 1, 1, 8),
  leg: new THREE.CylinderGeometry(1, .78, 1, 5),
  cone4: new THREE.ConeGeometry(1, 1, 4),
  cone5: new THREE.ConeGeometry(1, 1, 5),
};
const UP = new THREE.Vector3(0, 1, 0);
function part(parent, geo, color, pos, scl, rot, extra) {

function buildRig(i) {
  const c = CLAWS[i], s = c.scale * .9, L = prongLen(c) * K;
  const g = new THREE.Group();
  part(g, GEO.cyl8, COLOR.steelD, [0, .03 * s, 0], [.34 * s, .06 * s, .34 * s]);
  part(g, GEO.cyl8, c.color, [0, .22 * s, 0], [.3 * s, .32 * s, .3 * s]);
  part(g, GEO.box, COLOR.cream, [0, .52 * s, 0], [.34 * s, .28 * s, .34 * s]);
  part(g, GEO.cyl6, COLOR.steelD, [0, .72 * s, 0], [.07 * s, .14 * s, .07 * s]);
  const prongs = [];
  for (let k = 0; k < 3; k++) {
    const a = Math.PI / 2 + k * TAU / 3;
    const pivot = new THREE.Group();
    pivot.position.set(Math.cos(a) * .27 * s, .02 * s, Math.sin(a) * .27 * s);
    pivot.rotation.y = -a;
    g.add(pivot);
    const arm = new THREE.Group(); pivot.add(arm);
    part(arm, GEO.cyl6, COLOR.steelD, [0, 0, 0], [.05 * s, .16 * s, .05 * s], [Math.PI / 2, 0, 0]);
    part(arm, GEO.box, COLOR.steel, [0, -.27 * L, 0], [.07 * s, .54 * L, .13 * s]);
    part(arm, GEO.ico0, COLOR.steelD, [0, -.54 * L, 0], [.06 * s, .06 * s, .06 * s]);
    const lower = new THREE.Group(); lower.position.set(0, -.54 * L, 0); lower.rotation.z = -.62; arm.add(lower);
    part(lower, GEO.box, COLOR.steel, [0, -.21 * L, 0], [.065 * s, .42 * L, .12 * s]);
    part(lower, GEO.box, COLOR.steelD, [-.035 * s, -.42 * L, 0], [.11 * s, .05 * s, .12 * s]);
    prongs.push(arm);
  }
  return { g, prongs, top: .79 * s };
}

  const cp = Math.cos(view.pitch);
  camera.position.set(

  view.yaw += (view.ty - view.yaw) * k;

  machine.traverse(o => { if (o.isMesh) o.castShadow = false; });
  [deck.bridge, deck.trolley, deck.stick].forEach(g => g.traverse(o => { if (o.isMesh) o.castShadow = true; }));
  deck.cable.castShadow = true;
}
function drawSign() {
  if (!signMat) return;
  const cv = signMat.userData.cv, g = cv.getContext('2d');
  g.fillStyle = COLOR.cream; g.fillRect(0, 0, cv.width, cv.height);
  g.fillStyle = COLOR.ink; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.font = `700 ${lang === 'zh' ? 76 : 70}px "Inter","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif`;
  if (lang === 'en' && 'letterSpacing' in g) g.letterSpacing = '10px';
  g.fillText(t('sign'), cv.width / 2, cv.height / 2 + 4);
  if ('letterSpacing' in g) g.letterSpacing = '0px';
  g.fillStyle = COLOR.wood; g.fillRect(70, cv.height / 2 - 2, 70, 4); g.fillRect(cv.width - 140, cv.height / 2 - 2, 70, 4);
  signMat.map.needsUpdate = true;
}
let buttonPress = 0;
function pressButton() { buttonPress = 1; }

const rigs = CLAWS.map((c, i) => { const r = buildRig(i); machine.add(r.g); return r; });
const prizeMeshes = new Map();
function syncScene(dt) {
  // 夾爪
  rigs.forEach((r, i) => { r.g.visible = i === claw.type; });
  const rig = rigs[claw.type];
  const hx = WX(claw.x), hz = WZ(claw.z), hy = WY(claw.h);
  rig.g.position.set(hx, hy, hz);
  rig.g.rotation.z = claw.carry ? Math.sin(time * 4) * .03 : 0;
  const theta = -.08 + claw.open * .78;
  for (const p of rig.prongs) p.rotation.z = theta;
  deck.bridge.position.z = hz;
  const ty = INNER_TOP - .78;
  deck.trolley.position.set(hx, ty, hz);
  const top = new THREE.Vector3(hx, ty - .17, hz), bot = new THREE.Vector3(hx, hy + rig.top, hz);
  const len = Math.max(.01, top.y - bot.y);
  deck.cable.position.set(hx, (top.y + bot.y) / 2, hz);
  deck.cable.scale.set(.025, len, .025);
  // 搖桿、按鈕
  const aim = claw.state === 'aim';
  const kx = aim ? (keys.d ? 1 : 0) - (keys.a ? 1 : 0) : 0, kz = aim ? (keys.s ? 1 : 0) - (keys.w ? 1 : 0) : 0;
  const ix = kx * Math.cos(view.yaw) + kz * Math.sin(view.yaw), iz = -kx * Math.sin(view.yaw) + kz * Math.cos(view.yaw);
  deck.stick.rotation.x = approach(deck.stick.rotation.x, iz * .35, dt * 14);
  deck.stick.rotation.z = approach(deck.stick.rotation.z, -ix * .35, dt * 14);
  buttonPress = Math.max(0, buttonPress - dt * 5);
  deck.btn.position.y = .27 - .06 * Math.sin(Math.min(1, buttonPress) * Math.PI);
  // 目標光圈
  if (aim && aimTarget) {
    const fits = aimTarget.r <= CLAWS[claw.type].maxR;
    deck.ring.visible = true;
    deck.ring.material.color.set(fits ? '#6E8F5E' : '#B5533C');
    const s = aimTarget.r * K * 1.15 + .12;
    deck.ring.scale.set(s, s, s);
    deck.ring.position.set(WX(aimTarget.x), .015, WZ(aimTarget.z));
  } else deck.ring.visible = false;
  // 獎品
  const alive = new Set();
  for (const p of prizes) {
    alive.add(p.id);
    let m = prizeMeshes.get(p.id);
    if (!m) { m = buildAnimal(p.type.id, 2 * p.r * K * 1.05); machine.add(m); prizeMeshes.set(p.id, m); }
    m.visible = p.delay <= 0;
    m.position.set(WX(p.x), WY(p.h), WZ(p.z));
    m.rotation.y = p.yaw;
    let rz = 0;
    if (p.wiggle > 0) rz += Math.sin(time * 26) * .16 * p.wiggle;
    if (p.state === 'carried') rz += Math.sin(time * 4 + p.phase) * .06;
    m.rotation.z = rz;
  }
  for (const [id, m] of prizeMeshes) if (!alive.has(id)) { machine.remove(m); prizeMeshes.delete(id); }
}

/* ================= 介面（DOM） ================= */
const el = {
  money: $('#hMoney'), score: $('#hScore'), best: $('#hBest'), left: $('#hLeft'),
  timer: $('#timer'), tNum: $('#tNum'), tBar: $('#tBar'), toast: $('#toast'), prompt: $('#prompt'),
  tag: $('#tag'), tagName: $('#tagName'), tagInfo: $('#tagInfo'), floaters: $('#floaters'), screen: $('#screen'),
  claws: $('#claws'), inv: $('#inv'), invTotal: $('#invTotal'), sellAll: $('#sellAll'), dex: $('#dex'), grab: $('#grabBtn'),
};
let toastTimer = 0;
function showToast(text, type = 'info') {
  el.toast.textContent = text;
  el.toast.className = `toast show ${type}`;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.toast.classList.remove('show'), 2600);
}
const _v = new THREE.Vector3();
function toScreen(v) {
  _v.copy(v).project(camera);
  return [(_v.x + 1) / 2 * el.screen.clientWidth, (1 - _v.y) / 2 * el.screen.clientHeight];
}
function addFloater(pos, text, cls = '', dy = 0) {
  const [x, y] = toScreen(pos);
  const d = document.createElement('div');
  d.className = 'floater ' + cls; d.textContent = text;
  d.style.left = x + 'px'; d.style.top = (y + dy) + 'px';
  d.addEventListener('animationend', () => d.remove());
  el.floaters.appendChild(d);
}

/* 縮圖：用另一個小型 renderer 預先算好 */
const icons = {}, clawIcons = [];
function makeThumbs() {
  let r2;
  try { r2 = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true }); } catch (e) { return; }
  r2.setSize(144, 144); r2.setPixelRatio(1); r2.outputColorSpace = THREE.SRGBColorSpace;
  const s2 = new THREE.Scene();
  const dl = new THREE.DirectionalLight(0xffffff, 2.2); dl.position.set(-3, 6, 6); s2.add(dl);
  s2.add(new THREE.HemisphereLight(0xffffff, 0xc9bfb0, .9));
  const cam = new THREE.PerspectiveCamera(28, 1, .1, 50);
  const shot = (obj) => {
    s2.add(obj);
    const b = new THREE.Box3().setFromObject(obj), c = b.getCenter(new THREE.Vector3()), sz = b.getSize(new THREE.Vector3());
    const d = Math.max(sz.x, sz.y) * 1.25 / (2 * Math.tan(14 * Math.PI / 180)) + sz.z / 2;
    cam.position.set(c.x + d * .25, c.y + d * .22, c.z + d);
    cam.lookAt(c);
    r2.render(s2, cam);
    s2.remove(obj);
    return r2.domElement.toDataURL();
  };
  for (const ty of TYPES) { const m = buildAnimal(ty.id, 2); m.rotation.y = .5; icons[ty.id] = shot(m); }
  CLAWS.forEach((c, i) => { const r = buildRig(i); r.prongs.forEach(p => { p.rotation.z = .35; }); clawIcons[i] = shot(r.g); });
  r2.dispose(); r2.forceContextLoss();
}

const shown = {};
function setText(node, key, val) { if (shown[key] !== val) { shown[key] = val; node.textContent = val; } }
function renderClaws() {
  el.claws.innerHTML = CLAWS.map((c, i) => `
    <button class="claw" data-claw="${i}" title="${t('pressKey', { k: i + 1 })}">
      ${clawIcons[i] ? `<img src="${clawIcons[i]}" alt="">` : ''}
      <span class="nm">${nm(c)}</span>
      <span class="cost num">$${c.cost}</span>
      <span class="ds">${c.desc[lang]}</span>
    </button>`).join('');
}
function updateUI() {
  if (!game) return;
  setText(el.money, 'm', '$' + game.money);
  setText(el.score, 's', String(game.score));
  setText(el.best, 'b', String(best));
  setText(el.left, 'l', String(remaining()));
  const idle = claw.state === 'idle', aim = claw.state === 'aim';
  [...el.claws.children].forEach((b, i) => {
    b.classList.toggle('sel', i === selClaw);
    b.classList.toggle('poor', game.money < CLAWS[i].cost);
    b.setAttribute('aria-disabled', idle ? 'false' : 'true');
  });
  setText(el.grab, 'g', idle ? t('grabCoin') : aim ? t('grabDrop') : '…');
  // 計時
  el.timer.hidden = !aim;
  if (aim) {
    const s = Math.max(0, Math.ceil(claw.timer));
    setText(el.tNum, 't', String(s));
    el.tBar.style.width = clamp(claw.timer / PLAY_TIME, 0, 1) * 100 + '%';
    el.timer.classList.toggle('low', s <= 5);
  }
  // 待機提示
  const showPrompt = idle && !game.over && !modalOpen();
  el.prompt.hidden = !showPrompt;
  if (showPrompt) {
    const sc = CLAWS[selClaw], can = game.money >= sc.cost;
    setText(el.prompt, 'p', can ? t('idle', { c: sc.cost, n: nm(sc) }) : game.money >= CLAWS[0].cost ? t('idleSwitch', { n: nm(sc) }) : t('idleBroke'));
    el.prompt.classList.toggle('warn', !can);
  }
}
function updateTag() {
  if (claw.state !== 'aim' || !aimTarget) { el.tag.hidden = true; return; }
  const tg = aimTarget, c = CLAWS[claw.type], fits = tg.r <= c.maxR;
  const [x, y] = toScreen(new THREE.Vector3(WX(tg.x), WY(tg.h) + 2 * tg.r * K * 1.15 + .25, WZ(tg.z)));
  el.tag.hidden = false;
  el.tag.className = 'tag ' + (fits ? 'ok' : 'no');
  el.tag.style.left = clamp(x, 70, el.screen.clientWidth - 70) + 'px';
  el.tag.style.top = Math.max(70, y) + 'px';
  setText(el.tagName, 'tn', nm(tg.type));
  setText(el.tagInfo, 'ti', fits ? t('infoLine', { v: tg.type.value, s: tg.type.score, st: stars(tg.type) + '/5' }) : t('infoBig', { c: nm(CLAWS[needClaw(tg.type)]) }));
}
function renderInventory() {
  const items = TYPES.filter(ty => (game.inventory[ty.id] || 0) > 0);
  let total = 0;
  if (!items.length) {
    el.inv.innerHTML = `<p class="empty">${t('emptyBag')}</p>`;
  } else {
    el.inv.innerHTML = items.map(ty => {
      const n = game.inventory[ty.id]; total += n * ty.value;
      return `<div class="inv-row">
        ${icons[ty.id] ? `<img src="${icons[ty.id]}" alt="">` : '<span></span>'}
        <div><div class="nm">${nm(ty)} <span class="num" style="color:var(--muted)">×${n}</span></div>
             <div class="sub num">${t('each', { v: ty.value })}</div></div>
        <div class="inv-actions">
          <button class="btn" data-sell="${ty.id}" data-n="1">${t('sellOne')}</button>
          ${n > 1 ? `<button class="btn ghost" data-sell="${ty.id}" data-n="${n}">${t('sellRow')}</button>` : ''}
        </div></div>`;
    }).join('');
  }
  el.invTotal.textContent = t('bagValue', { v: total });
  el.sellAll.disabled = !items.length;
}
function renderDex() {
  el.dex.innerHTML = TYPES.map(ty => {
    const got = dex.has(ty.id), need = needClaw(ty), st = stars(ty);
    return `<div class="dex-item ${got ? '' : 'locked'}">
      ${got ? '<span class="got"></span>' : ''}
      ${icons[ty.id] ? `<img src="${icons[ty.id]}" alt="">` : ''}
      <div class="nm">${nm(ty)}</div>
      <span class="tier t${ty.tier}">${TIER_NAMES[lang][ty.tier]}</span>
      <div class="meta">${t(need < 2 ? 'needUp' : 'need', { c: nm(CLAWS[need]) })}</div>
      <div class="pips">${'■'.repeat(st)}<i>${'■'.repeat(5 - st)}</i></div>
      <div class="num"><b>$${ty.value}</b> · ${t('pts', { s: ty.score })}</div>
    </div>`;
  }).join('') + `<p class="dex-prog num">${t('progress', { a: dex.size, b: TYPES.length })}</p>`;
}
function applyLang() {
  document.documentElement.lang = lang === 'zh' ? 'zh-Hant' : 'en';
  document.title = t('docTitle');
  document.querySelectorAll('[data-i18n]').forEach(n => { n.innerHTML = t(n.dataset.i18n); });
  document.querySelectorAll('[data-i18n-title]').forEach(n => { n.title = t(n.dataset.i18nTitle); });
  document.querySelectorAll('[data-lang]').forEach(b => b.classList.toggle('on', b.dataset.lang === lang));
  for (const k in shown) delete shown[k];
  renderClaws();
  drawSign();
  if (game) { updateUI(); renderInventory(); renderDex(); }
}
function setLang(l) {
  if (l === lang || !I18N[l]) return;
  lang = l; store.set('clawParty.lang', l);
  el.toast.classList.remove('show');
  applyLang();
}
const SPEAKER = '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8v4h3l4 3V5L6 8z"/>';
function syncMute() {
  $('#muteBtn').innerHTML = SPEAKER + (muted ? '<path d="M13.5 8l4 4M17.5 8l-4 4"/></svg>' : '<path d="M13.5 7.5a3.5 3.5 0 0 1 0 5M15.5 5a7 7 0 0 1 0 10"/></svg>');
}

/* ================= 事件 ================= */
el.claws.addEventListener('click', e => { const b = e.target.closest('[data-claw]'); if (b) { unlockAudio(); selectClaw(+b.dataset.claw); } });
el.inv.addEventListener('click', e => { const b = e.target.closest('[data-sell]'); if (b) { unlockAudio(); sell(b.dataset.sell, +b.dataset.n); } });
el.sellAll.addEventListener('click', () => {
  unlockAudio();
  let sum = 0, cnt = 0;
  for (const ty of TYPES) { const n = game.inventory[ty.id] || 0; sum += n * ty.value; cnt += n; game.inventory[ty.id] = 0; }
  if (!cnt) return;
  game.money += sum; sfx.sell();
  showToast(t('soldAll', { k: cnt, v: sum }), 'good');
  updateUI(); renderInventory();
});
document.querySelectorAll('.tab').forEach(tab => tab.addEventListener('click', () => {
  document.querySelectorAll('.tab').forEach(x => x.classList.toggle('on', x === tab));
  $('#panel-shop').hidden = tab.dataset.tab !== 'shop';
  $('#panel-dex').hidden = tab.dataset.tab !== 'dex';
}));
document.querySelectorAll('[data-lang]').forEach(b => b.addEventListener('click', () => setLang(b.dataset.lang)));
$('#muteBtn').addEventListener('click', () => { unlockAudio(); muted = !muted; store.set('clawParty.muted', muted); syncMute(); });
$('#restartBtn').addEventListener('click', () => {
  unlockAudio();
  if (game.over) { newGame(); return; }
  $('#confirm').hidden = false;
  $('#cOk').focus();
});
$('#cCancel').addEventListener('click', () => { $('#confirm').hidden = true; });
$('#cOk').addEventListener('click', () => { $('#confirm').hidden = true; newGame(); });
$('#confirm').addEventListener('click', e => { if (e.target.id === 'confirm') $('#confirm').hidden = true; });
$('#mRestart').addEventListener('click', () => { unlockAudio(); newGame(); });
document.addEventListener('click', e => { const b = e.target.closest('button'); if (b) b.blur(); });

const KEYMAP = { KeyW: 'w', ArrowUp: 'w', KeyA: 'a', ArrowLeft: 'a', KeyS: 's', ArrowDown: 's', KeyD: 'd', ArrowRight: 'd' };
window.addEventListener('keydown', e => {
  if (e.target.closest && e.target.closest('input,textarea')) return;
  unlockAudio();
  if (!$('#confirm').hidden) {
    if (e.code === 'Escape') $('#confirm').hidden = true;
    if (e.code === 'Enter') { e.preventDefault(); $('#confirm').hidden = true; newGame(); }
    if (e.code === 'Space') e.preventDefault();
    return;
  }
  if (KEYMAP[e.code]) { keys[KEYMAP[e.code]] = true; e.preventDefault(); return; }
  if (e.code === 'Space') { e.preventDefault(); if (!e.repeat) action(); return; }
  const m = /^(Digit|Numpad)([123])$/.exec(e.code);
  if (m) selectClaw(+m[2] - 1);
});
window.addEventListener('keyup', e => { if (KEYMAP[e.code]) keys[KEYMAP[e.code]] = false; if (e.code === 'Space') e.preventDefault(); });
window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; });
document.querySelectorAll('[data-dir]').forEach(b => {
  const k = b.dataset.dir;
  const on = e => { e.preventDefault(); unlockAudio(); keys[k] = true; b.classList.add('on'); };
  const off = () => { keys[k] = false; b.classList.remove('on'); };
  b.addEventListener('pointerdown', on);
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => b.addEventListener(ev, off));
  b.addEventListener('contextmenu', e => e.preventDefault());
});
el.grab.addEventListener('pointerdown', e => { e.preventDefault(); unlockAudio(); action(); });

// 拖曳旋轉、滾輪縮放、雙指縮放、雙擊重設
const pointers = new Map();
let pinchDist = 0;
canvas.addEventListener('pointerdown', e => {
  canvas.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pointers.size === 2) { const [a, b] = [...pointers.values()]; pinchDist = Math.hypot(a.x - b.x, a.y - b.y); }
});
canvas.addEventListener('pointermove', e => {
  const prev = pointers.get(e.pointerId);
  if (!prev) return;
  const cur = { x: e.clientX, y: e.clientY };
  pointers.set(e.pointerId, cur);
  if (pointers.size === 1) {
    nudgeView(-(cur.x - prev.x) * .006, (cur.y - prev.y) * .005, 1);
  } else if (pointers.size === 2) {
    const [a, b] = [...pointers.values()], d = Math.hypot(a.x - b.x, a.y - b.y);
    if (pinchDist > 0) nudgeView(0, 0, pinchDist / d);
    pinchDist = d;
  }
});
['pointerup', 'pointercancel', 'lostpointercapture'].forEach(ev => canvas.addEventListener(ev, e => { pointers.delete(e.pointerId); pinchDist = 0; }));
canvas.addEventListener('wheel', e => { e.preventDefault(); nudgeView(0, 0, Math.exp(e.deltaY * .0012)); }, { passive: false });
canvas.addEventListener('dblclick', resetView);
$('#viewReset').addEventListener('click', resetView);

function resize() {
  if (!renderer) return;
  const w = el.screen.clientWidth;
  renderer.setSize(w, Math.round(w * .75), false);
}
window.addEventListener('resize', resize);

/* ================= 主迴圈 ================= */
let last = performance.now(), uiTimer = 0;
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  update(dt);
  updateCamera(dt);
  syncScene(dt);
  updateTag();
  renderer.render(scene, camera);
  uiTimer += dt;
  if (uiTimer > .1) { uiTimer = 0; updateUI(); }
  requestAnimationFrame(frame);
}

buildMachine();
syncMute();
if (renderer) makeThumbs();
applyLang();
if (!renderer) {
  const e = $('#glErr'); e.hidden = false; e.textContent = t('noGL');
} else {
  resize();
  newGame();
  requestAnimationFrame(frame);
}
window.__claw = { claw, camera, get prizes() { return prizes; }, get game() { return game; } };
